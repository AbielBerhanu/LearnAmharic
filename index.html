    <script>
        // --- Amharic Fidel Data ---
        const fidelFamilies = [

            { base: 'መ', forms: ['መ', 'ሙ', 'ሚ', 'ማ', 'ሜ', 'ም', 'ሞ'], name: 'Me', sounds: ['mä', 'mu', 'mi', 'ma', 'mē', 'mə', 'mo'] },
            { base: 'ሠ', forms: ['ሠ', 'ሡ', 'ሢ', 'ሣ', 'ሤ', 'ሥ', 'ሦ'], name: 'SSe', sounds: ['śä', 'śu', 'śi', 'śa', 'śē', 'śə', 'śo'] },
            { base: 'ረ', forms: ['ረ', 'ሩ', 'ሪ', 'ራ', 'ሬ', 'ር', 'ሮ'], name: 'Re', sounds: ['rä', 'ru', 'ri', 'ra', 'rē', 'rə', 'ro'] },

            { base: 'ቀ', forms: ['ቀ', 'ቁ', 'ቂ', 'ቃ', 'ቄ', 'ቅ', 'ቆ'], name: 'Qe', sounds: ['qä', 'qu', 'qi', 'qa', 'qē', 'qə', 'qo'] },
            { base: 'በ', forms: ['በ', 'ቡ', 'ቢ', 'ባ', 'ቤ', 'ብ', 'ቦ'], name: 'Be', sounds: ['bä', 'bu', 'bi', 'ba', 'bē', 'bə', 'bo'] },
            { base: 'ተ', forms: ['ተ', 'ቱ', 'ቲ', 'ታ', 'ቴ', 'ት', 'ቶ'], name: 'Te', sounds: ['tä', 'tu', 'ti', 'ta', 'tē', 'tə', 'to'] },

            { base: 'ኀ', forms: ['ኀ', 'ኁ', 'ኂ', 'ኃ', 'ኄ', 'ኅ', 'ኆ'], name: 'NeHase', sounds: ['xä', 'xu', 'xi', 'xa', 'xē', 'xə', 'xo'] },
            { base: 'ነ', forms: ['ነ', 'ኑ', 'ኒ', 'ና', 'ኔ', 'ን', 'ኖ'], name: 'Ne', sounds: ['nä', 'nu', 'ni', 'na', 'nē', 'nə', 'no'] },
            { base: 'ኘ', forms: ['ኘ', 'ኙ', 'ኚ', 'ኛ', 'ኜ', 'ኝ', 'ኞ'], name: 'Nye', sounds: ['ñä', 'ñu', 'ñi', 'ña', 'ñē', 'ñə', 'ño'] },
            { base: 'አ', forms: ['አ', 'ኡ', 'ኢ', 'ኣ', 'ኤ', 'እ', 'ኦ'], name: 'Alef', sounds: ["’ä", "’u", "’i", "’a", "’ē", "’ə", "’o"] },

            { base: 'ኸ', forms: ['ኸ', 'ኹ', 'ኺ', 'ኻ', 'ኼ', 'ኽ', 'ኾ'], name: 'KHe', sounds: ['khä', 'khu', 'khi', 'kha', 'khē', 'khə', 'kho'] },
            { base: 'ወ', forms: ['ወ', 'ዉ', 'ዊ', 'ዋ', 'ዌ', 'ው', 'ዎ'], name: 'We', sounds: ['wä', 'wu', 'wi', 'wa', 'wē', 'wə', 'wo'] },
            { base: 'ዐ', forms: ['ዐ', 'ዑ', 'ዒ', 'ዓ', 'ዔ', 'ዕ', 'ዖ'], name: 'Ayin', sounds: ["‘ä", "‘u", "‘i", "‘a", "‘ē", "‘ə", "‘o"] },
            { base: 'ዘ', forms: ['ዘ', 'ዙ', 'ዚ', 'ዛ', 'ዜ', 'ዝ', 'ዞ'], name: 'Ze', sounds: ['zä', 'zu', 'zi', 'za', 'zē', 'zə', 'zo'] },
            { base: 'ዠ', forms: ['ዠ', 'ዡ', 'ዢ', 'ዣ', 'ዤ', 'ዥ', 'ዦ'], name: 'Zhe', sounds: ['zhä', 'zhu', 'zhi', 'zha', 'zhē', 'zhə', 'zho'] },
            { base: 'የ', forms: ['የ', 'ዩ', 'ዪ', 'ያ', 'ዬ', 'ይ', 'ዮ'], name: 'Ye', sounds: ['yä', 'yu', 'yi', 'ya', 'yē', 'yə', 'yo'] },
            { base: 'ደ', forms: ['ደ', 'ዱ', 'ዲ', 'ዳ', 'ዴ', 'ድ', 'ዶ'], name: 'De', sounds: ['dä', 'du', 'di', 'da', 'dē', 'də', 'do'] },
            { base: 'ጀ', forms: ['ጀ', 'ጁ', 'ጂ', 'ጃ', 'ጄ', 'ጅ', 'ጆ'], name: 'Je', sounds: ['jä', 'ju', 'ji', 'ja', 'jē', 'jə', 'jo'] },
            { base: 'ገ', forms: ['ገ', 'ጉ', 'ጊ', 'ጋ', 'ጌ', 'ግ', 'ጎ'], name: 'Ge', sounds: ['gä', 'gu', 'gi', 'ga', 'gē', 'gə', 'go'] },
            { base: 'ጠ', forms: ['ጠ', 'ጡ', 'ጢ', 'ጣ', 'ጤ', 'ጥ', 'ጦ'], name: 'TTe', sounds: ['ṭä', 'ṭu', 'ṭi', 'ṭa', 'ṭē', 'ṭə', 'ṭo'] },
            { base: 'ጨ', forms: ['ጨ', 'ጩ', 'ጪ', 'ጫ', 'ጬ', 'ጭ', 'ጮ'], name: 'CHe', sounds: ['č’ä', 'č’u', 'č’i', 'č’a', 'č’ē', 'č’ə', 'č’o'] },
            { base: 'ጰ', forms: ['ጰ', 'ጱ', 'ጲ', 'ጳ', 'ጴ', 'ጵ', 'ጶ'], name: 'PPe', sounds: ['p’ä', 'p’u', 'p’i', 'p’a', 'p’ē', 'p’ə', 'p’o'] },
            { base: 'ጸ', forms: ['ጸ', 'ጹ', 'ጺ', 'ጻ', 'ጼ', 'ጽ', 'ጾ'], name: 'Tse', sounds: ['ṣä', 'ṣu', 'ṣi', 'ṣa', 'ṣē', 'ṣə', 'ṣo'] },
            { base: 'ፀ', forms: ['ፀ', 'ፁ', 'ፂ', 'ፃ', 'ፄ', 'ፅ', 'ፆ'], name: 'TTse', sounds: ['ṡä', 'ṡu', 'ṡi', 'ṡa', 'ṡē', 'ṡə', 'ṡo'] },
            { base: 'ፈ', forms: ['ፈ', 'ፉ', 'フィ', 'ፋ', 'ፌ', 'ፍ', 'ፎ'], name: 'Fe', sounds: ['fä', 'fu', 'fi', 'fa', 'fē', 'fə', 'fo'] },
            { base: 'ፐ', forms: ['ፐ', 'ፑ', 'ፒ', 'ፓ', 'ፔ', 'ፕ', 'ፖ'], name: 'Pe', sounds: ['pä', 'pu', 'pi', 'pa', 'pē', 'pə', 'po'] },
        ];
        const allBaseFlashcards = fidelFamilies.flatMap(family =>
            family.forms.map((form, index) => ({
                char: form,
                sound: family.sounds[index],
                familyName: family.name,
                id: form // Using the character itself as a unique ID
            }))
        );
        const totalFidelCount = allBaseFlashcards.length;
        const LOCAL_STORAGE_PROGRESS_KEY = 'amharicFidelSRSProgress';
        const LOCAL_STORAGE_THEME_KEY = 'amharicFidelTheme';


        // --- Global Application State ---
        let state = {
            userProgress: {},
            loading: true, 
            initError: null,
            currentView: 'dashboard', // 'dashboard', 'learnSelect', 'learnOrder', 'flashcards'
            reviewDeck: [],
            currentCardIndex: 0,
            learnFamily: null,
            learnOrderIndex: 0, 
            isCardFlipped: false,
            sessionComplete: false,
            sameSessionReviewQueue: [],
            theme: 'dark', 
            isSettingsModalOpen: false,
            isResetConfirmModalOpen: false,
        };

        // --- DOM Element References ---
        const appContainer = document.getElementById('app-container');
        const appHeaderEl = document.getElementById('app-header');
        const appMainEl = document.getElementById('app-main');
        const appFooterEl = document.getElementById('app-footer');
        const settingsModalContainerEl = document.getElementById('settings-modal-container');
        const resetConfirmModalContainerEl = document.getElementById('reset-confirm-modal-container');

        // --- Helper: Shuffle Array ---
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        // --- Icon SVGs (as functions returning strings) ---
        const SunIcon = () => `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-6.364-.386 1.591-1.591M3 12h2.25m.386-6.364 1.591 1.591M12 12a2.25 2.25 0 0 0-2.25 2.25c0 1.31.934 2.385 2.148 2.493a2.247 2.247 0 0 1 .102-.003A2.25 2.25 0 0 0 12 12Z" /></svg>`;
        const MoonIcon = () => `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" /></svg>`;
        const CogIcon = () => `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-1.007 1.11-.962l5.042.504c.55.045.994.51.952 1.062-.044.55-.506 1.006-.952 1.062l-5.042-.504c-.55-.045-1.016-.512-1.016-1.062Zm3.25 1.087c-.09-.542.388-1.036.932-1.073l5.042-.504c.544-.037 1.033.391 1.073.936.04.544-.385 1.036-.932 1.073l-5.042.504c-.545.037-1.033-.391-1.073-.936ZM12 9.75V6.375m0 3.375c-.39.105-.766.268-1.115.485m1.115-.485c.39-.105.766-.268 1.115-.485m-1.115.485V12m0 0c-.39.105-.766.268-1.115.485m1.115-.485c.39-.105.766-.268 1.115-.485m0 0V14.625m0-2.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0ZM12 18.75V15.375m0 3.375c.39-.105.766-.268 1.115-.485m-1.115.485c-.39.105-.766-.268-1.115-.485M9.594 15.94c.09.542.56 1.007 1.11-.962l5.042-.504c.55-.045.994.51.952-1.062-.044-.55-.506 1.006-.952-1.062l-5.042.504c-.55-.045-1.016.512-1.016-1.062Zm3.25-1.087c-.09.542.388-1.036.932-1.073l5.042-.504c.544-.037 1.033.391 1.073.936.04.544-.385 1.036-.932 1.073l-5.042.504c-.545.037-1.033-.391-1.073-.936Z" /></svg>`;
        const CheckIcon = () => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>`;

        // --- Theme Management ---
        function applyTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
                appContainer.classList.remove('bg-white', 'text-brand-blue');
                appContainer.classList.add('dark:bg-gradient-to-br', 'dark:from-slate-900', 'dark:to-slate-800', 'dark:text-gray-100');
            } else {
                document.documentElement.classList.remove('dark');
                appContainer.classList.remove('dark:bg-gradient-to-br', 'dark:from-slate-900', 'dark:to-slate-800', 'dark:text-gray-100');
                appContainer.classList.add('bg-white', 'text-brand-blue');
            }
            localStorage.setItem(LOCAL_STORAGE_THEME_KEY, state.theme);
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme();
            renderApp();
        }

        function loadTheme() {
            const storedTheme = localStorage.getItem(LOCAL_STORAGE_THEME_KEY);
            if (storedTheme) {
                state.theme = storedTheme;
            }
            applyTheme();
        }

        // --- Modal Management ---
        function openModal(modalId) {
            if (modalId === 'settings') state.isSettingsModalOpen = true;
            else if (modalId === 'resetConfirm') state.isResetConfirmModalOpen = true;
            renderModals();
        }

        function closeModal(modalId) {
            if (modalId === 'settings') state.isSettingsModalOpen = false;
            else if (modalId === 'resetConfirm') state.isResetConfirmModalOpen = false;
            renderModals();
        }

        // --- Progress Management (localStorage) ---
        function loadProgressFromLocalStorage() {
            state.loading = true;
            renderApp();
            try {
                const savedProgressJSON = localStorage.getItem(LOCAL_STORAGE_PROGRESS_KEY);
                if (savedProgressJSON) {
                    const parsedProgress = JSON.parse(savedProgressJSON);
                    for (const cardId in parsedProgress) {
                        if (parsedProgress[cardId].nextReview) {
                            parsedProgress[cardId].nextReview = new Date(parsedProgress[cardId].nextReview);
                        }
                        if (parsedProgress[cardId].lastReviewed) {
                            parsedProgress[cardId].lastReviewed = new Date(parsedProgress[cardId].lastReviewed);
                        }
                    }
                    state.userProgress = parsedProgress;
                } else {
                    state.userProgress = {};
                }
            } catch (error) {
                console.error("Error loading progress from localStorage:", error);
                state.initError = "Could not load saved progress. Your previous data might be corrupted or inaccessible.";
                state.userProgress = {};
            }
            state.loading = false;
            renderApp();
        }

        function saveProgressToLocalStorage() {
            try {
                const progressToSave = JSON.parse(JSON.stringify(state.userProgress));
                for (const cardId in progressToSave) {
                    if (progressToSave[cardId].nextReview instanceof Date) {
                        progressToSave[cardId].nextReview = progressToSave[cardId].nextReview.toISOString();
                    }
                    if (progressToSave[cardId].lastReviewed instanceof Date) {
                        progressToSave[cardId].lastReviewed = progressToSave[cardId].lastReviewed.toISOString();
                    }
                }
                localStorage.setItem(LOCAL_STORAGE_PROGRESS_KEY, JSON.stringify(progressToSave));
                console.log("Progress saved to localStorage.");
            } catch (error) {
                console.error("Error saving progress to localStorage:", error);
                state.initError = "Could not save your progress. Ensure your browser allows localStorage.";
                renderApp(); 
            }
        }

        function resetAllProgress() {
            state.loading = true;
            renderApp();
            try {
                localStorage.removeItem(LOCAL_STORAGE_PROGRESS_KEY);
                state.userProgress = {};
                state.currentView = 'dashboard';
                console.log("User progress reset successfully from localStorage.");
            } catch (error) {
                console.error("Error resetting progress in localStorage:", error);
                state.initError = "Failed to reset progress.";
            }
            state.loading = false;
            closeModal('resetConfirm');
            closeModal('settings');
            renderApp();
        }


        // --- SRS Logic & App Flow ---
        function calculateNextReview(cardId, status) {
            const progress = state.userProgress[cardId] || { status: 'new', interval: 0, lastReviewed: null };
            let newInterval = progress.interval;
            let nextReviewDate = new Date();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            switch (status) {
                case 'unknown':
                    newInterval = 0;
                    nextReviewDate.setDate(today.getDate());
                    break;
                case 'kinda':
                    newInterval = 1;
                    nextReviewDate.setDate(today.getDate() + 1);
                    break;
                case 'known':
                    if (progress.status === 'new' || progress.interval === 0) {
                        newInterval = 3;
                    } else if (progress.interval < 1) {
                        newInterval = 1;
                    } else {
                        newInterval = Math.min(Math.max(3, Math.round(progress.interval * 1.8)), 90);
                    }
                    nextReviewDate.setDate(today.getDate() + newInterval);
                    break;
                default:
                    newInterval = 1;
                    nextReviewDate.setDate(today.getDate() + 1);
            }
            return {
                status,
                interval: newInterval,
                nextReview: nextReviewDate,
                lastReviewed: today
            };
        }

        function handleReviewCard(cardId, reviewStatus) {
            const newProgressData = calculateNextReview(cardId, reviewStatus);
            state.userProgress[cardId] = newProgressData;
            saveProgressToLocalStorage();

            if (reviewStatus === 'unknown') {
                const cardToAdd = allBaseFlashcards.find(c => c.id === cardId);
                if (cardToAdd) {
                    state.sameSessionReviewQueue.push(cardToAdd);
                }
            }
            proceedToNextCard();
        }

        function proceedToNextCard() {
            state.isCardFlipped = false;
            if (state.currentCardIndex < state.reviewDeck.length - 1) {
                state.currentCardIndex++;
            } else {
                if (state.sameSessionReviewQueue.length > 0) {
                    state.reviewDeck = shuffleArray(state.sameSessionReviewQueue);
                    state.sameSessionReviewQueue = [];
                    state.currentCardIndex = 0;
                    state.sessionComplete = false;
                } else {
                    state.sessionComplete = true;
                }
            }
            renderApp();
        }

        function prepareReviewDeck() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const dueCards = allBaseFlashcards.filter(card => {
                const progress = state.userProgress[card.id];
                if (!progress || progress.status === 'new') return true;

                let nextReviewDate = progress.nextReview instanceof Date ? progress.nextReview : new Date(progress.nextReview);
                
                if (isNaN(nextReviewDate.getTime())) {
                       console.warn(`Invalid nextReview date for card ${card.id}:`, progress.nextReview);
                       return true;
                }

                nextReviewDate.setHours(0,0,0,0);
                return nextReviewDate <= today;
            });

            state.reviewDeck = shuffleArray(dueCards);
            state.currentCardIndex = 0;
            state.isCardFlipped = false;
            state.sessionComplete = false;
            state.sameSessionReviewQueue = [];

            state.currentView = 'flashcards';
            renderApp();
        }

        function handleStartReview() {
            prepareReviewDeck();
        }

        function handleStartLearnMode() {
            state.currentView = 'learnSelect';
            renderApp();
        }

        // --- Rendering Functions ---
        function renderHeader() {
            const themeClass = (light, dark) => state.theme === 'light' ? light : dark;
            const showDashboardButton = state.currentView !== 'dashboard';
            
            let headerHTML = `
                <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center py-4 ${themeClass('border-b border-brand-yellow/30', 'border-b border-slate-700')}">
                    <div class="flex items-center">
                        <img src="https://i.postimg.cc/d186TfGm/Screenshot-2025-06-07-at-11-15-37-PM.png" alt="Logo" class="h-10 sm:h-12 mr-4">
                        <h1 class="text-3xl sm:text-4xl font-bold ${themeClass('text-brand-blue', 'bg-clip-text text-transparent bg-gradient-to-r from-purple-500 via-pink-500 to-red-500')} mb-2 sm:mb-0">
                            Temar
                        </h1>
                    </div>
                    <div class="flex items-center space-x-3">
            `;
            if (showDashboardButton) {
                headerHTML += `
                        <button id="dashboard-btn-header" class="px-4 py-2 rounded-md text-sm font-medium shadow-md transition-colors ${themeClass('bg-brand-blue text-white hover:bg-opacity-90', 'bg-purple-600 hover:bg-purple-700 text-gray-100')}">
                            Dashboard
                        </button>
                `;
            }
            headerHTML += `
                    <button id="settings-btn-header" title="Settings" class="p-2 rounded-full transition-colors ${themeClass('text-brand-blue hover:bg-brand-yellow/20', 'text-gray-400 hover:bg-slate-700')}">
                        ${CogIcon()}
                    </button>
                </div></div>`;

        function renderDashboard() {

                const progress = state.userProgress[card.id];

                    if (progress.status === 'known') known++;
                    else if (progress.status === 'kinda') kinda++;
                    else if (progress.status === 'unknown') unknown++;

                    if (progress.nextReview) {
                        let nextReviewDate = progress.nextReview instanceof Date ? progress.nextReview : new Date(progress.nextReview);
                        if (!isNaN(nextReviewDate.getTime())) {
                            nextReviewDate.setHours(0, 0, 0, 0);
                            if (nextReviewDate <= today) isDue = true;

        function renderModal(modalId, title, contentHTML, isOpen) {
            const theme = state.theme;
            const themeClass = (light, dark) => theme === 'light' ? light : dark;
            const modalContainerEl = modalId === 'settings-modal' ? settingsModalContainerEl : resetConfirmModalContainerEl;

            if (!isOpen) {
                modalContainerEl.innerHTML = '';
                const backdrop = modalContainerEl.querySelector('.modal-backdrop');
                if (backdrop) backdrop.classList.remove('open');
                return;
            }

            modalContainerEl.innerHTML = `
                <div id="${modalId}-backdrop" class="modal-backdrop ${isOpen ? 'open' : ''}">
                    <div class="rounded-lg shadow-xl p-6 w-full max-w-md transform transition-all ${themeClass('bg-white text-brand-blue', 'bg-slate-800 text-gray-100')}">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold ${themeClass('text-brand-blue', 'text-gray-100')}">${title}</h3>
                            <button id="${modalId}-close-btn" class="${themeClass('text-brand-blue/70 hover:text-brand-blue', 'text-gray-400 hover:text-gray-200')} text-2xl leading-none" aria-label="Close modal">&times;</button>
                        </div>
                        ${contentHTML}
                    </div>
                </div>
            `;

            const backdropEl = document.getElementById(`${modalId}-backdrop`);
            if (backdropEl) {
                backdropEl.addEventListener('click', (event) => {
                    if (event.target === backdropEl) {
                         if(modalId === 'settings-modal') closeModal('settings');
                         if(modalId === 'reset-confirm-modal') closeModal('resetConfirm');
                    }
                });
            }

            document.getElementById(`${modalId}-close-btn`).addEventListener('click', () => {
                 if(modalId === 'settings-modal') closeModal('settings');
                 if(modalId === 'reset-confirm-modal') closeModal('resetConfirm');
            });
        }

                            Reset All Progress
                        </button>
                        <p class="text-xs mt-2 ${themeClass('text-brand-blue/70', 'text-gray-400')}">This action cannot be undone and will clear locally stored data.</p>
                    </div>
                </div>
            `;
        }

        function renderResetConfirmModalContent() {
            const theme = state.theme;
            const themeClass = (light, dark) => theme === 'light' ? light : dark;
            return `
                <div>
                    <p class="mb-6 ${themeClass('text-brand-blue', 'text-gray-300')}">Are you sure you want to reset all your learning progress? This action cannot be undone.</p>
                    <div class="flex justify-end space-x-3">
                        <button id="cancel-reset-btn-modal" class="px-4 py-2 rounded-md font-medium transition-colors ${themeClass('bg-brand-blue/10 hover:bg-brand-blue/20 text-brand-blue', 'bg-slate-600 hover:bg-slate-500 text-gray-200')}">Cancel</button>
                        <button id="confirm-reset-btn-modal" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium transition-colors">Yes, Reset</button>
                    </div>
                </div>
            `;
        }

        function renderModals() {
            renderModal('settings-modal', 'Settings', renderSettingsModalContent(), state.isSettingsModalOpen);
            if (state.isSettingsModalOpen) {
                document.getElementById('toggle-theme-btn-modal').addEventListener('click', toggleTheme);
                document.getElementById('reset-progress-btn-modal').addEventListener('click', () => {
                    closeModal('settings');
                    openModal('resetConfirm');
                });
            }

            renderModal('reset-confirm-modal', 'Confirm Reset', renderResetConfirmModalContent(), state.isResetConfirmModalOpen);
            if (state.isResetConfirmModalOpen) {
                document.getElementById('cancel-reset-btn-modal').addEventListener('click', () => closeModal('resetConfirm'));
                document.getElementById('confirm-reset-btn-modal').addEventListener('click', resetAllProgress);
            }
        }

        // --- Main Application Render Function ---
        function renderApp() {
            applyTheme();
            renderHeader();
            renderFooter();

            if (state.initError) {
                renderError(state.initError);
            } else if (state.loading) {
                renderLoadingIndicator();
            } else {
                renderCurrentView();
            }
            renderModals();
        }

        function renderCurrentView() {
            switch (state.currentView) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'learnSelect':
                    renderLearnSelectView();
                    break;
                case 'learnOrder':
                    renderLearnOrderView();
                    break;
                case 'flashcards':
                    renderFlashcardView();
                    break;
                default:
                    state.currentView = 'dashboard';
                    renderDashboard();
            }
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadProgressFromLocalStorage();
        });
    </script>
</body>
</html>
